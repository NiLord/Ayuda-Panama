AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infraestructura Serverless para la Plataforma de Emergencia Ayuda Los Santos.
  Incluye DynamoDB On-Demand, S3 cifrado para evidencia, HTTP API Gateway v2 y Lambdas (Python 3.13).

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Ambiente de despliegue.

  AdminSecretKey:
    Type: String
    NoEcho: true
    Default: SinaprocEmergencia2026!
    Description: Clave de autenticación para acceso de autoridades (SINAPROC / Cruz Roja) al endpoint de exportación con PII.

  AppApiKey:
    Type: String
    NoEcho: true
    Description: API Key requerida por la aplicación móvil Ayuda Panamá.

  AppApiSecret:
    Type: String
    NoEcho: true
    Description: Secreto de verificación de integridad para peticiones de Ayuda Panamá.

Resources:
  # ============================================================================
  # ALMACENAMIENTO DE DATOS (DYNAMODB)
  # ============================================================================
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub lse-reports-table-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1_UbicacionPrioridad
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ReportersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub lse-reporters-table-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # ============================================================================
  # ALMACENAMIENTO DE EVIDENCIA FOTOGRÁFICA (S3)
  # ============================================================================
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub lse-evidence-photos-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # ============================================================================
  # ROL IAM DE MÍNIMO PRIVILEGIO PARA LAMBDAS
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub lse-lambda-execution-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ReportsTable.Arn
                  - !Sub ${ReportsTable.Arn}/index/*
                  - !GetAtt ReportersTable.Arn
        - PolicyName: S3EvidenceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub ${EvidenceBucket.Arn}/*

  # ============================================================================
  # API GATEWAY (HTTP API V2)
  # ============================================================================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub lse-http-api-${Environment}
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: ['Content-Type', 'Authorization', 'X-Api-Key', 'X-App-Secret', 'X-Admin-Key']
        MaxAge: 3600

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  # ============================================================================
  # FUNCIONES LAMBDA (PYTHON 3.13)
  # ============================================================================
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub lse-authorizer-${Environment}
      Runtime: python3.13
      Handler: backend.src.handlers.authorizer.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          APP_API_KEY: !Ref AppApiKey
          APP_API_SECRET: !Ref AppApiSecret
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"isAuthorized": False}

  SubmitReportFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub lse-submit-report-${Environment}
      Runtime: python3.13
      Handler: backend.src.handlers.submit_report.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          REPORTS_TABLE_NAME: !Ref ReportsTable
          REPORTERS_TABLE_NAME: !Ref ReportersTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "Placeholder para despliegue inicial"}

  GetPublicReportsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub lse-get-public-reports-${Environment}
      Runtime: python3.13
      Handler: backend.src.handlers.get_public_reports.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          REPORTS_TABLE_NAME: !Ref ReportsTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": '{"type":"FeatureCollection","features":[]}'}

  GetPresignedUrlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub lse-get-upload-presign-${Environment}
      Runtime: python3.13
      Handler: backend.src.handlers.get_presigned_url.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          EVIDENCE_BUCKET_NAME: !Ref EvidenceBucket
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "{}"}

  ExportEdanFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub lse-export-edan-${Environment}
      Runtime: python3.13
      Handler: backend.src.handlers.export_edan.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          REPORTS_TABLE_NAME: !Ref ReportsTable
          ADMIN_SECRET_KEY: !Ref AdminSecretKey
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "{}"}

  # ============================================================================
  # AUTORIZADOR LAMBDA (HTTP API V2)
  # ============================================================================
  HttpApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: REQUEST
      AuthorizerPayloadFormatVersion: '2.0'
      AuthorizerResultTtlInSeconds: 300
      EnableSimpleResponses: true
      IdentitySource:
        - '$request.header.x-api-key'
        - '$request.header.x-app-secret'
      Name: !Sub lse-authorizer-${Environment}
      AuthorizerUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations

  AuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/authorizers/*

  # Parámetro en AWS Systems Manager Parameter Store para trazabilidad de la clave
  AppApiKeyParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /ayuda-panama/${Environment}/api-key
      Type: String
      Value: !Ref AppApiKey
      Description: Identificador API Key para la app móvil Ayuda Panamá.

  # Configuración global centralizada de la aplicación (AppConfig) en AWS SSM
  AppConfigParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /ayuda-panama/${Environment}/app-config
      Type: String
      Description: Configuración dinámica de la aplicación móvil Ayuda Panamá (vector de eventos y endpoints)
      Value: !Sub |
        {
          "environment": "${Environment}",
          "apiBaseUrl": "https://ayudapanama-api.fernandogonzalez.dev",
          "httpApiRawEndpoint": "${HttpApi.ApiEndpoint}",
          "postalCodeServiceUrl": "https://codigospostalespanama.gob.pa/api/location",
          "defaultEventCode": "SISMO_OCTUBRE_2026",
          "events": [
            {
              "codigo": "SISMO_OCTUBRE_2026",
              "nombre": "Sismo Octubre 2026",
              "tipo": "TERREMOTO",
              "descripcion": "Evaluación rápida de daños y necesidades por sismo regional en Panamá.",
              "activo": true
            },
            {
              "codigo": "INUNDACION_TEMPORAL_2026",
              "nombre": "Inundaciones y Desbordamientos 2026",
              "tipo": "INUNDACION",
              "descripcion": "Reporte de afectaciones por lluvias torrenciales e inundaciones.",
              "activo": false
            },
            {
              "codigo": "DESLIZAMIENTO_TIERRA_2026",
              "nombre": "Deslizamientos y Vías Bloqueadas 2026",
              "tipo": "DESLIZAMIENTO",
              "descripcion": "Reportes de deslaves y bloqueos de infraestructura vial o residencial.",
              "activo": false
            }
          ],
          "emergencyContacts": {
            "sinaproc": "*335",
            "cruzRoja": "119",
            "policia": "104",
            "bomberos": "103"
          },
          "rules": {
            "requireIdPhoto": true,
            "minDamagePhotos": 2
          }
        }

  # ============================================================================
  # INTEGRACIONES Y RUTAS DE API GATEWAY
  # ============================================================================
  SubmitIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SubmitReportFunction.Arn
      PayloadFormatVersion: '2.0'

  SubmitRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/v1/reports
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Sub integrations/${SubmitIntegration}

  PublicIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetPublicReportsFunction.Arn
      PayloadFormatVersion: '2.0'

  PublicRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/v1/reports/public
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Sub integrations/${PublicIntegration}

  PresignIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetPresignedUrlFunction.Arn
      PayloadFormatVersion: '2.0'

  PresignRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/v1/uploads/presign
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Sub integrations/${PresignIntegration}

  ExportIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ExportEdanFunction.Arn
      PayloadFormatVersion: '2.0'

  ExportRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/v1/reports/export
      Target: !Sub integrations/${ExportIntegration}

  # Permisos para que API Gateway invoque las Lambdas
  SubmitPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubmitReportFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  PublicPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetPublicReportsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  PresignPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetPresignedUrlFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  ExportPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExportEdanFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

# ============================================================================
# SALIDAS (OUTPUTS)
# ============================================================================
Outputs:
  HttpApiUrl:
    Description: URL base de la API HTTP de emergencia
    Value: !GetAtt HttpApi.ApiEndpoint

  ReportsTableName:
    Description: Nombre de la tabla DynamoDB de reportes
    Value: !Ref ReportsTable

  ReportersTableName:
    Description: Nombre de la tabla DynamoDB de informantes
    Value: !Ref ReportersTable

  EvidenceBucketName:
    Description: Nombre del bucket S3 para fotos de evidencia
    Value: !Ref EvidenceBucket

  AuthorizerFunctionName:
    Description: Nombre de la función Lambda autorizadora
    Value: !Ref AuthorizerFunction

  AppApiKeySsmParam:
    Description: Parámetro SSM donde se encuentra registrado el API Key
    Value: !Ref AppApiKeyParam

  AppConfigSsmParam:
    Description: Parámetro SSM con la configuración completa (AppConfig) de la app
    Value: !Ref AppConfigParam
