name: Backend & API (Lambdas Python)

on:
  push:
    tags:
      - 'api-v*'
  pull_request:
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Pruebas Unitarias de Backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ejecutar Suite de Pruebas Unitarias
        run: |
          python3 -m unittest discover backend/tests

  deploy:
    name: Desplegar Lambdas en AWS
    needs: test
    if: startsWith(github.ref, 'refs/tags/api-v')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ENVIRONMENT: prod

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Empaquetar Código de Lambdas
        run: |
          zip -rq lambda_code.zip backend/

      - name: Actualizar Código de las Lambdas
        run: |
          FUNCTIONS=(
            "lse-authorizer-${ENVIRONMENT}"
            "lse-submit-report-${ENVIRONMENT}"
            "lse-get-public-reports-${ENVIRONMENT}"
            "lse-get-upload-presign-${ENVIRONMENT}"
            "lse-export-edan-${ENVIRONMENT}"
            "lse-check-duplicate-${ENVIRONMENT}"
            "lse-get-miviot-tramite-${ENVIRONMENT}"
            "lse-sync-sinaproc-${ENVIRONMENT}"
          )
          for fn in "${FUNCTIONS[@]}"; do
            echo "==> Actualizando código de $fn..."
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file fileb://lambda_code.zip \
              --region "${AWS_REGION}" > /dev/null
          done

      - name: Resumen del Despliegue de API
        run: |
          echo "### ⚡ Despliegue de Backend & API Exitoso" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Región**: \`${AWS_REGION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Funciones Actualizadas**: \`lse-authorizer\`, \`lse-submit-report\`, \`lse-get-public-reports\`, \`lse-get-upload-presign\`, \`lse-export-edan\`" >> $GITHUB_STEP_SUMMARY
