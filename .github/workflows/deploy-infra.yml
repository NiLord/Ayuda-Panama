name: Infraestructura CI/CD (CloudFormation)

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
    tags:
      - 'infra-v*'
  pull_request:
    paths:
      - 'infra/**'

jobs:
  validate-and-deploy:
    name: Validar y Desplegar CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validar plantilla de CloudFormation
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/cloudformation.yaml \
            --region us-east-1

      - name: Desplegar CloudFormation Stack
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/infra-v')
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation.yaml \
            --stack-name lse-emergency-platform-prod \
            --parameter-overrides Environment=prod \
            --capabilities CAPABILITY_NAMED_IAM \
            --region us-east-1
