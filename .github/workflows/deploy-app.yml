name: Frontend App (Flutter Mobile)

on:
  push:
    tags:
      - 'app-v*'
  pull_request:
    paths:
      - 'frontend/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-and-test:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: |
          cd frontend
          flutter pub get

      - name: Análisis Estático de Código
        run: |
          cd frontend
          flutter analyze

      - name: Pruebas Unitarias y de Widgets
        run: |
          cd frontend
          flutter test

  build-release:
    name: Compilar Artefactos Release
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: |
          cd frontend
          flutter pub get

      - name: Autenticar en AWS con OIDC (Para consultar SSM)
        if: env.HAS_AWS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
        env:
          HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}

      - name: Resolver Credenciales de API (AWS SSM / GitHub Secrets)
        id: resolve-api-config
        run: |
          API_URL="${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://9wz3cetp9k.execute-api.us-east-1.amazonaws.com' }}"
          
          # Intentar recuperar API Key desde AWS SSM o fallback a Secrets
          API_KEY=""
          if [ "${{ secrets.AWS_ROLE_TO_ASSUME }}" != "" ]; then
            API_KEY=$(aws ssm get-parameter --name "/ayuda-panama/prod/api-key" --query "Parameter.Value" --output text --region us-east-1 2>/dev/null || echo "")
          fi
          if [ -z "$API_KEY" ]; then
            API_KEY="${{ secrets.API_KEY || secrets.APP_API_KEY }}"
          fi

          # Intentar recuperar API Secret desde AWS SSM o fallback a Secrets
          API_SECRET=""
          if [ "${{ secrets.AWS_ROLE_TO_ASSUME }}" != "" ]; then
            API_SECRET=$(aws ssm get-parameter --name "/ayuda-panama/prod/api-secret" --with-decryption --query "Parameter.Value" --output text --region us-east-1 2>/dev/null || echo "")
          fi
          if [ -z "$API_SECRET" ]; then
            API_SECRET="${{ secrets.API_SECRET || secrets.APP_API_SECRET }}"
          fi

          echo "::add-mask::$API_KEY"
          echo "::add-mask::$API_SECRET"
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "api_key=$API_KEY" >> $GITHUB_OUTPUT
          echo "api_secret=$API_SECRET" >> $GITHUB_OUTPUT
          echo "✓ Configuración de API inyectada exitosamente (Endpoint: $API_URL)"

      - name: Preparar Keystore de Producción (Si existe secreto)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decodificando Keystore de Producción..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > frontend/android/upload-keystore.jks
            echo "KEYSTORE_READY=true" >> $GITHUB_ENV
          else
            echo "No se encontró secreto ANDROID_KEYSTORE_BASE64. Compilando con firma debug..."
            echo "KEYSTORE_READY=false" >> $GITHUB_ENV
          fi

      - name: Compilar Android App Bundle (.aab para Google Play)
        run: |
          cd frontend
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="${{ steps.resolve-api-config.outputs.api_url }}" \
            --dart-define=API_KEY="${{ steps.resolve-api-config.outputs.api_key }}" \
            --dart-define=API_SECRET="${{ steps.resolve-api-config.outputs.api_secret }}"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Compilar APK Universal (.apk para instalación directa)
        run: |
          cd frontend
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ steps.resolve-api-config.outputs.api_url }}" \
            --dart-define=API_KEY="${{ steps.resolve-api-config.outputs.api_key }}" \
            --dart-define=API_SECRET="${{ steps.resolve-api-config.outputs.api_secret }}"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Organizar Binarios para Release
        run: |
          mkdir -p release-binaries
          cp frontend/build/app/outputs/bundle/release/app-release.aab release-binaries/ayuda-panama-${{ github.ref_name }}.aab
          cp frontend/build/app/outputs/flutter-apk/app-release.apk release-binaries/ayuda-panama-${{ github.ref_name }}.apk
          ls -lh release-binaries/

      - name: Publicar Artefacto AAB en Actions
        uses: actions/upload-artifact@v4
        with:
          name: ayuda-panama-${{ github.ref_name }}.aab
          path: release-binaries/ayuda-panama-${{ github.ref_name }}.aab

      - name: Publicar Artefacto APK en Actions
        uses: actions/upload-artifact@v4
        with:
          name: ayuda-panama-${{ github.ref_name }}.apk
          path: release-binaries/ayuda-panama-${{ github.ref_name }}.apk

      - name: Crear GitHub Release y Adjuntar Binarios
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-binaries/ayuda-panama-${{ github.ref_name }}.aab
            release-binaries/ayuda-panama-${{ github.ref_name }}.apk
