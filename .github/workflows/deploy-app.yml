name: Frontend App (Flutter Mobile)

on:
  push:
    tags:
      - 'app-v*'
  pull_request:
    paths:
      - 'frontend/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-and-test:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: |
          cd frontend
          flutter pub get

      - name: Análisis Estático de Código
        run: |
          cd frontend
          flutter analyze

      - name: Pruebas Unitarias y de Widgets
        run: |
          cd frontend
          flutter test

  build-release:
    name: Compilar Artefactos Release
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: |
          cd frontend
          flutter pub get

      - name: Preparar Keystore de Producción (Si existe secreto)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decodificando Keystore de Producción..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > frontend/android/upload-keystore.jks
            echo "KEYSTORE_READY=true" >> $GITHUB_ENV
          else
            echo "No se encontró secreto ANDROID_KEYSTORE_BASE64. Compilando con firma debug..."
            echo "KEYSTORE_READY=false" >> $GITHUB_ENV
          fi

      - name: Compilar Android App Bundle (.aab para Google Play)
        run: |
          cd frontend
          flutter build appbundle --release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Compilar APK Universal (.apk para instalación directa)
        run: |
          cd frontend
          flutter build apk --release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Organizar Binarios para Release
        run: |
          mkdir -p release-binaries
          cp frontend/build/app/outputs/bundle/release/app-release.aab release-binaries/ayuda-panama-${{ github.ref_name }}.aab
          cp frontend/build/app/outputs/flutter-apk/app-release.apk release-binaries/ayuda-panama-${{ github.ref_name }}.apk
          ls -lh release-binaries/

      - name: Publicar Artefacto AAB en Actions
        uses: actions/upload-artifact@v4
        with:
          name: ayuda-panama-${{ github.ref_name }}.aab
          path: release-binaries/ayuda-panama-${{ github.ref_name }}.aab

      - name: Publicar Artefacto APK en Actions
        uses: actions/upload-artifact@v4
        with:
          name: ayuda-panama-${{ github.ref_name }}.apk
          path: release-binaries/ayuda-panama-${{ github.ref_name }}.apk

      - name: Crear GitHub Release y Adjuntar Binarios
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-binaries/ayuda-panama-${{ github.ref_name }}.aab
            release-binaries/ayuda-panama-${{ github.ref_name }}.apk
